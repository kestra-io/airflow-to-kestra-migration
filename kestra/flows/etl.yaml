id: etl
namespace: airflow

tasks:
  - id: get_astronauts
    type: io.kestra.plugin.core.http.Request
    uri: http://api.open-notify.org/astros.json
  
  - id: loop
    type: io.kestra.plugin.core.flow.Loop
    values: "{{ fromJson(outputs.get_astronauts.body).people }}"
    tasks:
      - id: print_astronomer
        type: io.kestra.plugin.core.log.Log
        message: "{{ fromJson(item.value).name }} is currently in space flying on the {{ fromJson(item.value).craft }}"

triggers:
  - id: optional_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "@daily"