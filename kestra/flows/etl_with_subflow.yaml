id: etl_with_subflow
namespace: airflow

tasks:
  - id: get_astronauts
    type: io.kestra.plugin.core.flow.Subflow
    namespace: airflow
    flowId: etl_python

  - id: loop
    type: io.kestra.plugin.core.flow.Loop
    values: "{{ outputs.get_astronauts.outputs.list_of_people_in_space }}"
    tasks:
      - id: print_astronomer
        type: io.kestra.plugin.core.log.Log
        message: "{{ fromJson(item.value).name }} is currently in space flying on the {{ fromJson(item.value).craft }}"
